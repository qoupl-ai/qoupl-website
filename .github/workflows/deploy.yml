name: Deploy

# Builds the image, pushes it to Artifact Registry, deploys Cloud Run, then
# Firebase Hosting. Runs only when started by hand or on a published release.
on:
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: Google Cloud project id (overrides the GCP_PROJECT_ID repository variable)
        required: false
        type: string
  release:
    types: [published]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ inputs.gcp_project_id || vars.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE: qoupl-website
  AR_REPO: qoupl

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Require a project id
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::Set the GCP_PROJECT_ID repository variable or pass gcp_project_id."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          # Public values (URL and anon key), passed as BuildKit secrets so they
          # stay out of image history. The service-role key never enters the build.
          secrets: |
            supabase_url=${{ secrets.SUPABASE_URL }}
            supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          # max-instances 3 caps spend if the site is hammered or a bot loops.
          gcloud run deploy "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}" \
            --service-account "qoupl-web-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --min-instances=0 \
            --max-instances=3 \
            --port=8080 \
            --allow-unauthenticated \
            --set-secrets "NEXT_PUBLIC_SUPABASE_URL=supabase-url:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@15.35.0 deploy --only hosting --project "${GCP_PROJECT_ID}"
